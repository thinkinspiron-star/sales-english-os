t:space-between;gap:12px;align-items:center;margin-bottom:26px}.eyebrow{text-transform:uppercase;letter-spacing:2px;color:#8e9bad;font-weight:800;font-size:10px}.topbar h1{font-size:clamp(23px,2.6vw,33px);line-height:1.25;margin:6px 0 5px;letter-spacing:-.7px;color:#172c49}.sub{margin:0;font-size:13px;color:#7d899c}.datepill{color:#697b94;background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:25px;font-size:12px;white-space:nowrap}.grid{display:grid;gap:19px}.grid.two{grid-template-columns:minmax(0,1.3fr) minmax(280px,.85fr)}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:23px;box-shadow:var(--shadow)}.card h2{margin:0 0 5px;font-size:18px;color:#182c49}.card p{margin:5px 0}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.sectionhead h2{margin:0;font-size:18px}.tiny{font-size:12px;color:var(--mute)}.micro{font-size:10px;color:var(--mute)}.muted{color:var(--mute)}.hero{background:linear-gradient(125deg,#172c49 0%,#234875 76%,#2d6189 100%);color:white;border:none;padding:30px;position:relative;overflow:hidden;min-height:218px}.hero:after{content:'S';position:absolute;font-weight:900;font-size:310px;line-height:1;top:-120px;right:2px;color:rgba(255,255,255,.045);pointer-events:none}.hero h2{color:white;font-size:29px;line-height:1.25;margin:8px 0 10px;position:relative}.hero p{color:#cad8ea;max-width:580px;font-size:13px}.hero .eyebrow{color:#a9c9f9}.hero .actions{margin-top:19px}.btn{border:1px solid transparent;border-radius:11px;padding:11px 16px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.14s}.btn:hover{filter:brightness(.97);transform:translateY(-1px)}.primary{background:var(--blue);color:white}.light{background:#fff;color:#1e4576}.outline{border-color:#d9e1ed;background:#fff;color:#2b456a}.soft{background:#f0f5fe;color:#2d65b3 le{font-size:14px;font-weight:760}.day-row .desc{font-size:11px;color:#8493a5}.day-row .chev{margin-left:auto;color:#9aa8b9}.weekgroup{margin:0 0 23px}.weekgroup .weektitle{font-size:14px;margin:0 0 11px;color:#354963;display:flex;justify-content:space-between}.weekgroup .weekitems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.reviewfront{font-size:clamp(20px,3vw,28px);font-weight:780;line-height:1.4;color:#1c365a;margin:14px 0}.reviewback{font-size:17px;color:#3b6654;font-weight:650}.emptystate{text-align:center;padding:35px 20px;color:#77869c}.emptyicon{font-size:42px;margin-bottom:5px}.bargraph{height:160px;display:flex;align-items:flex-end;gap:13px;padding:15px 0 0}.barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}.bar{width:100%;max-width:47px;min-height:4px;border-radius:8px 8px 2px 2px;background:linear-gradient(#5b94e6,#b3ccf5)}.barcol .lab{font-size:11px;color:#90a0b1}.barcol .val{font-size:10px;color:#637793}.form-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1b3856;color:#fff;padding:12px 20px;border-radius:12px;box-shadow:0 12px 45px #19365b4d;z-index:100;min-width:180px;text-align:center;font-size:13px}.mobile-nav{display:none}.menu-mini{margin-top:12px;font-size:11px;color:#89a0bc}.lined{border-top:1px solid var(--line);padding-top:16px;margin-top:17px}details summary{cursor:pointer}.notice{border:1px solid #ead9ab;background:#fff9ed;border-radius:12px;padding:12px 15px;color:#8c6d39;font-size:12px}.nowrap{white-space:nowrap}.bigbutton{width:100%}.badgecount{display:inline-flex;background:#f6c95e;color:#342d18;border-radius:20px;min-width:20px;height:20px;align-items:center;justify-content:center;font-size:10px}.textarea-short{min-height:80px!important}
@media(max-width:1050px){.main{padding:24px 23px 85px}.sidebar{width:210px;padding-left:12px;padding-right:12px}.grid.two,.practice-grid{grid-template-columns:1fr}.hero{min-height:200px}.grid.three{gap:10px}.stat{padding:16px}}@media(max-width:730px){.sidebar{display:none}.shell{display:block}.main{padding:20px 15px 95px;max-width:100%}.topbar{margin-bottom:18px;align-items:flex-start}.topbar h1{font-size:26px}.datepill{font-size:10px;padding:7px 9px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{padding:13px 11px}.stat .num{font-size:24px}.stat .label{font-size:10px}.stat .symbol{font-size:15px}.card{padding:17px;border-radius:17px}.hero{padding:22px;min-height:215px}.hero h2{font-size:26px}.prompt .en{font-size:21px}.weekgroup .weekitems{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;padding:6px 4px calc(7px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid #e6eaf2;box-shadow:0 -4px 24px #0b25401a;z-index:50;justify-content:space-around}.mobile-nav button{flex:1;border:0;background:none;color:#9aa9bc;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;border-radius:9px;max-width:90px}.mobile-nav button span{font-size:18px}.mobile-nav button.active{color:#2866bc;font-weight:800;background:#f0f5fd}.toast{bottom:85px;width:fit-content;max-width:90%}.practice-grid{gap:13px}.btn{font-size:12px}.bargraph{gap:7px}}

<script>
const CURRICULUM = {"lessons":[{"day":1,"title":"自我介绍","goal":"用三句短句介绍自己的职位与工作","question":"Could you briefly introduce yourself and tell me what you do at Wenergy?","example":"Hi, I'm Danny. I'm an overseas sales manager at Wenergy. I work with EPC companies and distributors on energy storage projects.","scene":"第一次客户视频会议","week":1},{"day":2,"title":"介绍Wenergy","goal":"讲清楚公司定位，避免长句","question":"What does Wenergy do?","example":"Wenergy provides battery energy storage solutions. We work on commercial, industrial, and utility-scale projects. Our team also supports system design and technical discussions.","scene":"渠道商首次认识公司","week":1},{"day":3,"title":"介绍C&I产品","goal":"区分户外柜与典型应用","question":"What products do you offer for commercial and industrial customers?","example":"For C&I projects, we offer outdoor battery storage cabinets. We can discuss models such as the CL261 and CL289 based on the site's requirements. The best choice depends on power and energy needs.","scene":"工商储产品介绍","week":1},{"day":4,"title":"介绍大型储能","goal":"用清晰的数字描述集装箱","question":"What can you offer for a utility-scale storage project?","example":"We can discuss containerized battery energy storage systems, including a 3.85 MWh option. First, we need to understand your grid connection, required power, and project schedule.","scene":"大型储能初步交流","week":1},{"day":5,"title":"介绍移动储能","goal":"用简单英语解释移动储能的用途","question":"Do you also supply mobile energy storage systems?","example":"Yes, we also offer mobile energy storage solutions. They can support temporary power and mobile charging applications. We need to check the charging interface and power requirements for each project.","scene":"移动储能客户来电","week":1},{"day":6,"title":"合作对象","goal":"说明EPC与分销商合作模式","question":"Who do you usually work with?","example":"We mainly work with EPC contractors, distributors, and project developers. We can support them with product information, technical proposals, and commercial discussions.","scene":"渠道合作沟通","week":1},{"day":7,"title":"第一周通关","goal":"脱稿完成90秒公司与个人介绍","question":"Please introduce yourself, your company, and the products you sell.","example":"I'm Danny, an overseas sales manager at Wenergy. We provide C&I and utility-scale battery storage solutions, including outdoor cabinets and containerized systems. I'd be happy to understand your current projects and explore potential cooperation.","scene":"第一周口语测验","week":1},{"day":8,"title":"客户行业","goal":"自然询问客户的行业与场景","question":"What would you ask first about our factory project?","example":"First, I'd like to understand your business. What kind of products does the factory make? Does the site operate 24 hours a day?","scene":"工厂储能需求摸底","week":2},{"day":9,"title":"电费与电价","goal":"准确区分tariff与bill","question":"What information do you need about our electricity costs?","example":"Could you share your recent electricity bills and tariff structure? We'd like to know your peak and off-peak rates. That will help us estimate possible savings.","scene":"工厂电价分析","week":2},{"day":10,"title":"负荷曲线","goal":"请求客户提供负荷数据","question":"How can we help you size the battery correctly?","example":"We would need the site's load profile, ideally in 15-minute or hourly intervals. We also need to understand the peak demand and daily energy consumption.","scene":"负荷曲线收资","week":2},{"day":11,"title":"光伏系统","goal":"询问现有光伏及余电情况","question":"We already have rooftop solar. What else would you need to know?","example":"What's the installed PV capacity? How much solar energy is used on-site, and is any excess power exported to the grid?","scene":"光储改造项目","week":2},{"day":12,"title":"峰谷套利","goal":"解释日充晚放与实际前提","question":"How could a battery reduce our electricity bills?","example":"The battery may charge when energy is cheaper or when excess PV is available. It can discharge during expensive peak hours. We would confirm the tariff and load data before calculating savings.","scene":"削峰移峰价值说明","week":2},{"day":13,"title":"备电需求","goal":"澄清备电时长和关键负载","question":"We want four hours of backup power. What should we tell you?","example":"Which loads must stay online during an outage? What is their power demand, and do you need four hours at full load? That will help us estimate the required capacity.","scene":"备电项目需求澄清","week":2},{"day":14,"title":"第二周通关","goal":"完成结构化需求访谈","question":"Please lead a short discovery call for our C&I storage project.","example":"I'd like to ask about your operation, tariff, and load profile first. We also need your existing PV information and the main purpose of the battery. Then we can discuss a preliminary design.","scene":"需求访谈阶段测验","week":2},{"day":15,"title":"kW与kWh","goal":"用易懂语言区分功率与容量","question":"What's the difference between kW and kWh in a battery system?","example":"Kilowatts describe the power the system can deliver at one time. Kilowatt-hours describe how much energy it can store. We need both figures to size the system.","scene":"客户技术知识问答","week":3},{"day":16,"title":"储能时长","goal":"解释容量除功率的粗略关系","question":"Can a 200 kW battery support the factory for four hours?","example":"It depends on the usable battery capacity and the actual load. For example, a 200 kW load for four hours needs roughly 800 kWh before losses and operating limits.","scene":"工厂四小时备电","week":3},{"day":17,"title":"EMS功能","goal":"用短句介绍系统能量管理","question":"What does your EMS actually do?","example":"Our EMS helps monitor the battery and manage charging and discharging. It can follow an agreed operating strategy based on the site's requirements.","scene":"EMS方案介绍","week":3},{"day":18,"title":"并网与离网","goal":"区别并网经济运行和备电","question":"Can this battery work when the grid goes down?","example":"That depends on the system design and grid connection. Backup operation may require additional equipment and controls. Our engineers need to confirm the configuration.","scene":"停电运行模式澄清","week":3},{"day":19,"title":"PCS职责","goal":"解释逆变器和功率转换","question":"Why do we need a PCS with the battery?","example":"The PCS converts power between the battery and the AC electrical system. Its power rating and grid compliance are important for the project design.","scene":"技术负责人问PCS","week":3},{"day":20,"title":"光储柴混合","goal":"解释混合供电前先收资","question":"Can we combine batteries, solar panels, and diesel generators?","example":"A hybrid system may be possible. We need to review the generator controls, load profile, and operating priorities before proposing the architecture.","scene":"光储柴项目交流","week":3},{"day":21,"title":"第三周通关","goal":"回答六个常见技术问题","question":"Could you explain the main technical requirements for our battery system?","example":"We should confirm the power rating, energy capacity, operating hours, and grid conditions. We can then review the PCS, EMS, and system operating modes with your engineers.","scene":"技术问答阶段测验","week":3},{"day":22,"title":"项目规模","goal":"确认MWh、MW和配置","question":"We need a 10 MWh battery system. What would you ask next?","example":"Thanks. Could you confirm the required power in megawatts and the target discharge duration? We also need the connection voltage and installation site details.","scene":"大型储能项目收资","week":4},{"day":23,"title":"并网标准","goal":"不轻易承诺当地认证","question":"Is your system compliant with our local grid code?","example":"We take grid compliance seriously. The exact requirements depend on the country, equipment configuration, and project connection point. Let me verify the relevant documents with our technical team.","scene":"并网合规讨论","week":4},{"day":24,"title":"采购阶段","goal":"询问项目是否RTB和采购时间","question":"When should we involve your team in the project?","example":"The earlier, the better. Could you tell me whether the project is in design, permitting, or ready-to-build stage? We can align the proposal with your procurement timeline.","scene":"项目开发阶段判断","week":4},{"day":25,"title":"交付范围","goal":"明确设备供货和EPC边界","question":"Can Wenergy deliver the complete project on a turnkey basis?","example":"Our scope depends on the agreed contract. We can provide battery equipment and technical support, while local installation and EPC work may be handled by partners. Let's define the scope clearly.","scene":"EPC工作范围讨论","week":4},{"day":26,"title":"技术方案","goal":"索取单线图和站点数据","question":"What documents do you need for a preliminary proposal?","example":"Please share the single-line diagram, load data, grid connection requirements, and project timeline if available. We can then ask our engineers to review the concept.","scene":"正式技术资料请求","week":4},{"day":27,"title":"技术会议","goal":"推进工程师对接","question":"Could we arrange a technical meeting with your engineers?","example":"Certainly. Please share a few suitable time slots and the key technical questions. I'll coordinate with our engineering team and confirm the meeting.","scene":"工程师技术会议","week":4},{"day":28,"title":"第四周通关","goal":"模拟完整技术澄清会议","question":"Please run a technical clarification meeting for our BESS project.","example":"First, let's confirm the project objectives and electrical parameters. Then we can review system scope, grid compliance, and schedule. After the call, we'll summarize the open points.","scene":"完整技术澄清测验","week":4},{"day":29,"title":"价格偏高","goal":"不降价先谈整体价值","question":"Your quotation is higher than another supplier's. Why?","example":"I understand your concern. We should compare the full scope, warranty terms, and service arrangements, not only the equipment price. Could you share the main differences in the quotations?","scene":"采购价格异议","week":5},{"day":30,"title":"竞品比较","goal":"避免没有依据地贬低竞品","question":"Why should we choose Wenergy rather than a cheaper supplier?","example":"We aim to provide suitable solutions and dependable technical support. I'd suggest comparing system specifications, service scope, and long-term project needs before making a decision.","scene":"竞争对手比较","week":5},{"day":31,"title":"质保条款","goal":"先核实质保定义和条件","question":"Can you guarantee a certain number of battery cycles?","example":"Cycle life and warranty terms depend on the specific product and operating conditions. Let me check the official specification and warranty documents before giving you a firm figure.","scene":"循环寿命质疑","week":5},{"day":32,"title":"售后响应","goal":"合理回应24小时到场要求","question":"Can you guarantee an engineer on-site within 24 hours?","example":"I understand why response time matters. I can't guarantee 24-hour on-site service before checking local arrangements. Let me confirm what we can commit to in the contract.","scene":"售后SLA谈判","week":5},{"day":33,"title":"欧洲支持","goal":"介绍鹿特丹备件，不夸大承诺","question":"Do you have after-sales support in Europe?","example":"We have spare parts available in Rotterdam to help support European customers. For a specific project, we should confirm the service process and response commitments with our team.","scene":"欧洲售后能力","week":5},{"day":34,"title":"交期压力","goal":"确认生产交付条件","question":"Can you deliver the systems in six weeks?","example":"I'd like to confirm the model, quantity, specifications, and delivery destination first. Then I'll check production and logistics with our team and provide a realistic schedule.","scene":"交期谈判","week":5},{"day":35,"title":"第五周通关","goal":"连续处理五个客户异议","question":"Our concerns are price, warranty, delivery, technical support, and project risk. How would you respond?","example":"Those are important points. Let's review them one by one, starting with the project requirements. I'll confirm the open items internally and send you a written summary.","scene":"商务异议测验","week":5},{"day":36,"title":"询价澄清","goal":"确认报价数量及配置","question":"We need a quote for 50 battery cabinets. What do you need?","example":"Could you confirm the required capacity, PCS configuration, destination, and target delivery date? We can then prepare a quotation based on a clear scope.","scene":"大批量柜子询价","week":6},{"day":37,"title":"报价条件","goal":"解释EXW/FOB/CIF需要确认","question":"Is your price delivered to our warehouse?","example":"The delivery terms need to be specified in the quotation. Could you confirm your preferred Incoterms and destination? I'll ask our logistics team to check the relevant costs.","scene":"贸易条款沟通","week":6},{"day":38,"title":"付款条款","goal":"避免未经授权承诺信用账期","question":"Can we pay after the equipment arrives?","example":"I understand your request. Payment terms need to be reviewed by our commercial team. We can discuss a structure that works for both sides and confirm it in writing.","scene":"付款方式谈判","week":6},{"day":39,"title":"技术评审","goal":"引导正式反馈清单","question":"Your engineer has several comments on the proposal. What's next?","example":"Please send us the comments in one document if possible. I'll coordinate a technical review and return a consolidated response with any necessary revisions.","scene":"技术反馈跟进","week":6},{"day":40,"title":"会议总结","goal":"英文总结行动项","question":"Can you summarize today's meeting before we finish?","example":"Of course. We confirmed the main system requirements and identified a few open technical points. I'll send a summary with owners and next steps after the meeting.","scene":"会议结束总结","week":6},{"day":41,"title":"催进展","goal":"礼貌推动客户内部评审","question":"We haven't made a decision yet. Can you follow up next month?","example":"Of course. May I ask what is still under review and when you expect a decision? I'd like to support your team with any missing information.","scene":"客户决策推进","week":6},{"day":42,"title":"第六周通关","goal":"完成15分钟商业谈判","question":"We have reviewed your proposal. How can we move this opportunity forward?","example":"Let's confirm the remaining technical points, commercial terms, and decision timeline. I can coordinate an updated proposal and set up a follow-up call if helpful.","scene":"商务推进测验","week":6},{"day":43,"title":"乌克兰EPC","goal":"了解企业不断电需求","question":"Many factories in Ukraine need backup power. What can you offer?","example":"We can discuss battery systems for backup and energy management applications. First, we need the critical load, backup duration, and grid conditions at each site.","scene":"乌克兰工商业客户","week":7},{"day":44,"title":"德国渠道商","goal":"探索分销合作而非直接压货","question":"How would you support us if we became your distributor in Germany?","example":"We can discuss product training, technical documentation, and project support. I'd also like to understand your customer base and the segments you serve.","scene":"德国分销商合作","week":7},{"day":45,"title":"土耳其项目商","goal":"澄清12MW项目进度","question":"We're developing a 12 MW project. Can you provide equipment?","example":"We'd be happy to review the opportunity. Could you tell me the target energy capacity, connection requirements, and development stage? That will help us identify the next steps.","scene":"土耳其储能开发商","week":7},{"day":46,"title":"波兰工厂","goal":"评估PV加储能经济性","question":"Our Polish factory has solar panels. Is a battery worth installing?","example":"It could be useful, depending on your tariff, solar generation, and load profile. We should calculate the expected savings and compare them with the investment cost.","scene":"波兰工厂光储项目","week":7},{"day":47,"title":"阿联酋移动储能","goal":"明确AC充电枪数与回充要求","question":"We need to charge several electric vehicles at the same time. Can a mobile battery help?","example":"Possibly. How many vehicles will charge at once, and what is the charging power per vehicle? We should also confirm the recharging method and operating schedule.","scene":"阿联酋车辆补能","week":7},{"day":48,"title":"印度连续生产工厂","goal":"厘清24小时负荷和经济性","question":"Our plant runs 24 hours a day. How would you approach the project?","example":"I'd start with the hourly load profile and tariff. We should identify the peak demand and the main purpose of storage, then assess possible system sizes.","scene":"印度制造业项目","week":7},{"day":49,"title":"第七周通关","goal":"用不同国家客户角色完成问答","question":"You're meeting an EPC contractor from Europe for the first time. How would you lead the discussion?","example":"I'd first introduce our company briefly, then ask about the client's projects and requirements. We can explore where our products and technical team could add value.","scene":"多国客户模拟测验","week":7},{"day":50,"title":"电话临场开场","goal":"不看稿自然建立关系","question":"Hi Danny, thanks for taking my call. Do you have a few minutes?","example":"Yes, of course. Thanks for calling. I'm happy to speak with you. What would you like to discuss first?","scene":"突发客户电话","week":8},{"day":51,"title":"听不懂时澄清","goal":"练习礼貌要求重述","question":"Sorry, the connection isn't clear. Did you catch my question?","example":"I caught part of it, but not everything. Could you please repeat the last part a little more slowly?","scene":"视频会议网络问题","week":8},{"day":52,"title":"没有立即答案","goal":"承认未知并承诺核查","question":"Can you confirm the grid certification right now?","example":"I don't want to give you an incorrect answer. Let me check the official documentation and get back to you after the meeting.","scene":"棘手认证追问","week":8},{"day":53,"title":"不同意见","goal":"礼貌提出替代方案","question":"We think your proposed battery size is too small. Do you agree?","example":"That's a fair concern. Could we review the load assumptions and backup duration together? Then we can see whether a larger system is needed.","scene":"技术意见分歧","week":8},{"day":54,"title":"主持多人会议","goal":"安排顺序和工程师发言","question":"Several colleagues joined the call. How would you begin?","example":"Thanks, everyone, for joining. Let's start with a quick introduction, then review the technical requirements and open questions. After that, we'll discuss next steps.","scene":"多方技术会议","week":8},{"day":55,"title":"复盘与下一步","goal":"清晰约定会议之后的动作","question":"What happens after this meeting?","example":"I'll summarize the open questions and send the relevant documents. We'll assign owners for each action and agree on the next review date.","scene":"闭环推进","week":8},{"day":56,"title":"第八周通关","goal":"完成30分钟综合模拟","question":"Please lead this project meeting from introduction to next steps.","example":"Thanks for joining. I'd like to understand your project goals first, then discuss the technical approach, service expectations, and commercial next steps. Shall we begin with the site requirements?","scene":"全流程客户会议测验","week":8},{"day":57,"title":"毕业测试一","goal":"不看提示做自我介绍与公司介绍","question":"Tell us about yourself and why your company is relevant to our BESS project.","example":"I'm Danny, an overseas sales manager at Wenergy. We support C&I and utility-scale energy storage projects. I'd like to learn more about your requirements and see how we can cooperate.","scene":"毕业评估-开场","week":9},{"day":58,"title":"毕业测试二","goal":"独立做需求访谈并精准提问","question":"Our factory is considering battery storage. What do you need to know?","example":"Let's start with your operating hours, peak power demand, daily energy use, tariff, and solar generation. Then we can discuss the main business objective and possible system size.","scene":"毕业评估-需求","week":9},{"day":59,"title":"毕业测试三","goal":"处理价格与售后双重异议","question":"Your price is high and we need guaranteed service. Can you address both?","example":"I understand both concerns. Let's compare the full technical and service scope first. I'll confirm the service terms internally and then review the commercial options with you.","scene":"毕业评估-异议","week":9},{"day":60,"title":"毕业测试四","goal":"完整总结并促成下一步","question":"We're almost done. What are the agreed next steps?","example":"I'll send a meeting summary with the outstanding information and action owners. We'll confirm the technical scope and commercial terms, then arrange the next call to review the updated proposal.","scene":"毕业评估-收尾","week":9}],"weeks":[{"title":"破冰与产品表达","focus":"短句先行：30秒自我介绍、公司和三类储能产品","phrases":[["I work with EPC companies.","我与EPC公司合作"],["We provide energy storage solutions.","我们提供储能解决方案"],["Could you tell me more about your project?","能介绍一下您的项目吗？"]]},{"title":"需求挖掘","focus":"行业、电费、负荷曲线、光伏与备电目的","phrases":[["What is your peak demand?","您的最大需量是多少？"],["Could you share your load profile?","能提供负荷曲线吗？"],["Does the site already have solar PV?","现场已有光伏吗？"]]},{"title":"核心技术解释","focus":"kW/kWh、EMS、PCS、并离网和光储柴","phrases":[["It depends on the system design.","这取决于系统设计"],["We need to confirm the operating mode.","我们需要确认运行模式"],["Let me explain the difference.","我来解释一下区别"]]},{"title":"项目技术澄清","focus":"MW/MWh、并网、供货边界和工程师会议","phrases":[["Could you share the single-line diagram?","能提供单线图吗？"],["What stage is the project at?","项目处于什么阶段？"],["Let me check with our engineers.","我向工程师确认一下"]]},{"title":"价格与服务异议","focus":"价格、质保、服务SLA和交付风险","phrases":[["I understand your concern.","我理解您的顾虑"],["We should compare the full scope.","我们应比较完整供货范围"],["I cannot guarantee that at this stage.","现阶段我无法保证这一点"]]},{"title":"谈判和成交推进","focus":"报价条件、付款、反馈整合、推动下一步","phrases":[["Could you confirm the delivery terms?","能确认交付条款吗？"],["We can discuss the payment terms.","我们可以讨论付款条件"],["What would be the next step on your side?","您那边下一步是什么？"]]},{"title":"多国真实客户","focus":"乌克兰、德国、波兰、印度、土耳其、阿联酋","phrases":[["Let us review the project requirements.","我们先审视项目要求"],["Could you clarify the project timeline?","能澄清项目时间表吗？"],["I would like to understand your market.","我想了解您的市场"]]},{"title":"会议临场能力","focus":"电话、口音、澄清、多人会议与临场分歧","phrases":[["Could you repeat that more slowly?","您能慢一点重复吗？"],["I do not want to give an incorrect answer.","我不想提供不准确的回答"],["Let us summarize the next steps.","我们总结下一步吧"]]},{"title":"毕业综合考核","focus":"完整的海外BESS客户会议：开场→需求→异议→行动","phrases":[["Let me summarize what we agreed.","我来总结达成的共识"],["I will get back to you after checking.","核实之后我会回复您"],["Shall we schedule a follow-up meeting?","我们安排下一次会议好吗？"]]}]};

const SPECIAL=[{"id":"P01","kind":"电话","title":"第一次致电EPC采购负责人","brief":"向一位欧洲EPC采购经理介绍Wenergy，争取获得一个五分钟沟通机会。","focus":"开场、自报身份、确认是否方便","challenge":"客户说目前在开会，你用一句英语约另一个时间。","level":"B1–B2","lines":[{"who":"Danny","en":"Hello, this is Danny from Wenergy. Am I speaking with the person responsible for battery storage procurement?","zh":"您好，我是Wenergy的Danny。请问您负责储能采购吗？"},{"who":"Customer","en":"Yes, I handle procurement. What is your call about?","zh":"是的，我负责采购。你来电有什么事？"},{"who":"Danny","en":"We provide commercial and utility-scale battery energy storage systems. Is this a convenient time for a quick introduction?","zh":"我们提供工商业及大型储能系统。现在方便简单介绍一下吗？"},{"who":"Customer","en":"I have about two minutes. Please go ahead.","zh":"我大概有两分钟，你说吧。"},{"who":"Danny","en":"Thank you. We work with EPC companies and distributors on energy storage projects. Are you currently working on any C&I storage opportunities?","zh":"谢谢。我们与EPC和分销商合作开发储能项目。您目前有工商业储能项目机会吗？"},{"who":"Customer","en":"Possibly, but we're still reviewing suppliers.","zh":"可能有，但我们还在评估供应商。"},{"who":"Danny","en":"Understood. May I send you a short product overview and arrange a technical call if it looks relevant?","zh":"明白。我可以发一份简短产品介绍，如果合适再安排技术电话吗？"},{"who":"Customer","en":"Yes, email me the information first.","zh":"可以，先把资料发邮件给我。"},{"who":"Danny","en":"Of course. Could I confirm the best email address to use?","zh":"当然。我可以确认一下最合适的邮箱地址吗？"},{"who":"Customer","en":"Please use the procurement address on our website.","zh":"请使用我们网站上的采购邮箱。"}]},{"id":"P02","kind":"电话","title":"客户突然打来电话","brief":"客户在没有预约的情况下致电询问设备参数，你需要先确认问题并避免仓促承诺。","focus":"接听、缓冲、确认问题","challenge":"客户继续问未核实的认证，你要用英语安全回应。","level":"B1–B2","lines":[{"who":"Customer","en":"Hi Danny, this is Martin from Baltic Energy. Do you have a minute?","zh":"Danny你好，我是Baltic Energy的Martin。你有一分钟吗？"},{"who":"Danny","en":"Hi Martin, good to hear from you. Yes, I have a few minutes. How can I help?","zh":"Martin你好，很高兴接到你的电话。我有几分钟时间，有什么可以帮您？"},{"who":"Customer","en":"We're comparing 200-kilowatt battery cabinets. What is your recommended model?","zh":"我们在比较200千瓦储能柜。你推荐哪个型号？"},{"who":"Danny","en":"We have several options. Can I check whether 200 kilowatts refers to charging and discharging power?","zh":"我们有几种选择。我先确认一下：200千瓦指充放电功率吗？"},{"who":"Customer","en":"Yes, continuous AC output power.","zh":"是的，指持续交流输出功率。"},{"who":"Danny","en":"Thanks. Could you also tell me the target energy capacity and project location?","zh":"谢谢。您还能告诉我目标储能容量和项目所在地吗？"},{"who":"Customer","en":"Around 400 kilowatt-hours, in Germany.","zh":"大约400千瓦时，地点在德国。"},{"who":"Danny","en":"Understood. I can check the suitable configuration and Germany-specific grid requirements with our engineers.","zh":"明白。我会和工程师核实合适的配置及德国并网要求。"},{"who":"Customer","en":"Can you send me the specification today?","zh":"今天能发规格书吗？"},{"who":"Danny","en":"I'll check the available documents and get back to you with the confirmed version.","zh":"我会核实可提供的文件，并将确认后的版本回复给您。"}]},{"id":"P03","kind":"电话","title":"回复海外客户未接来电","brief":"海外客户昨晚打电话，但你没接到；现在主动回拨并弄清意图。","focus":"回拨、道歉、引出目的","challenge":"对方讲太快，要求慢一点重说关键需求。","level":"B1–B2","lines":[{"who":"Danny","en":"Hello, this is Danny from Wenergy. I'm returning your call from yesterday. Sorry I missed it.","zh":"您好，我是Wenergy的Danny。我来回拨您昨天的电话，抱歉当时没接到。"},{"who":"Customer","en":"Hi Danny, thanks for calling back. I wanted to ask about your mobile battery units.","zh":"Danny你好，谢谢回电话。我想问移动储能设备。"},{"who":"Danny","en":"Of course. Are you looking at a specific project or just exploring options?","zh":"当然。您有具体项目，还是先了解产品？"},{"who":"Customer","en":"We have a customer who needs temporary power at a construction site.","zh":"我们有客户需要工地临时供电。"},{"who":"Danny","en":"Got it. Do they need a mobile unit on a truck, or a battery that can be moved by forklift?","zh":"明白。他们需要车载移动储能，还是叉车可搬运的电池？"},{"who":"Customer","en":"Probably truck-mounted. It has to move between two sites.","zh":"应该是车载的，因为需要在两个工地之间移动。"},{"who":"Danny","en":"Understood. Could you share the required power output, energy capacity and operating hours?","zh":"了解。可以告诉我输出功率、容量和运行小时数吗？"},{"who":"Customer","en":"I'll need to check those numbers.","zh":"这些数字我还要确认。"},{"who":"Danny","en":"No problem. I can send you a short requirements checklist after the call.","zh":"没问题。通话后我可以发一份简短的需求清单。"},{"who":"Customer","en":"That would help. Thanks, Danny.","zh":"那太好了，谢谢Danny。"}]},{"id":"P04","kind":"电话","title":"听不清、口音重和网络延迟","brief":"电话断断续续，客户说了一个重要数字，你必须重述确认。","focus":"请求重复、确认数字、修复沟通","challenge":"当客户讲 480 kW 和 4.8 MW 时，复述单位避免混淆。","level":"B1–B2","lines":[{"who":"Customer","en":"Our project is, uh, about four eighty, and we need the equipment by the end of Q1.","zh":"我们项目大约四百八十，设备要在第一季度末前到位。"},{"who":"Danny","en":"Sorry, the line is breaking up. Could you repeat the power requirement, please?","zh":"抱歉线路断断续续。您能重复一下功率需求吗？"},{"who":"Customer","en":"Four hundred and eighty kilowatts.","zh":"四百八十千瓦。"},{"who":"Danny","en":"Just to confirm, that's 480 kilowatts, not 480 kilowatt-hours, correct?","zh":"我确认一下，是480千瓦，不是480千瓦时，对吗？"},{"who":"Customer","en":"Correct. The energy capacity is about one megawatt-hour.","zh":"正确。能量容量约一兆瓦时。"},{"who":"Danny","en":"Thank you. So the power is 480 kilowatts and the capacity is around one megawatt-hour.","zh":"谢谢。也就是功率480千瓦，容量约1兆瓦时。"},{"who":"Customer","en":"Exactly. Also, we'd like the units to arrive in March.","zh":"没错。此外我们希望设备三月到货。"},{"who":"Danny","en":"Did you say March? I'll note it as your target delivery month, subject to confirmation.","zh":"您说的是三月吗？我会记录为目标交付月份，具体还需确认。"},{"who":"Customer","en":"Yes, March. The site is in Romania.","zh":"是，三月。现场在罗马尼亚。"},{"who":"Danny","en":"Perfect. I'll summarize those details in an email so we can avoid any misunderstanding.","zh":"好的。我会把这些要点写进邮件，避免误解。"}]},{"id":"P05","kind":"电话","title":"了解24小时工厂的用电需求","brief":"客户要为食品工厂安装储能系统；先把用电信息问清楚。","focus":"顺序提问、区分kW与kWh","challenge":"客户只告诉你每月电费，你应该追问什么？","level":"B1–B2","lines":[{"who":"Danny","en":"Before we recommend a system, could I ask a few questions about the factory?","zh":"推荐系统前，我可以问几个关于工厂的问题吗？"},{"who":"Customer","en":"Sure, go ahead.","zh":"当然，请问。"},{"who":"Danny","en":"Does the factory operate 24 hours a day?","zh":"工厂是每天24小时运行吗？"},{"who":"Customer","en":"Yes, including weekends.","zh":"是的，周末也运行。"},{"who":"Danny","en":"What is the average daily electricity consumption in kilowatt-hours?","zh":"每天平均耗电量是多少千瓦时？"},{"who":"Customer","en":"Roughly 2,500 kilowatt-hours.","zh":"大约2500千瓦时。"},{"who":"Danny","en":"And what is the peak power demand, in kilowatts?","zh":"那峰值功率需求是多少千瓦？"},{"who":"Customer","en":"Around 300 kilowatts.","zh":"大约300千瓦。"},{"who":"Danny","en":"Do you have a 15-minute or hourly load profile we could review?","zh":"您有15分钟或小时级负荷曲线供我们分析吗？"},{"who":"Customer","en":"Yes, I can request it from the facility manager.","zh":"有，我可以向设施经理索取。"}]},{"id":"P06","kind":"电话","title":"追问光伏系统及峰谷电价","brief":"客户已有屋顶光伏，想降低电费，你需要确认储能收益的前提。","focus":"光伏富余、电价、投资回报","challenge":"客户问“能省多少钱”，请不要直接承诺收益。","level":"B1–B2","lines":[{"who":"Customer","en":"We already have a 500-kilowatt solar system. Would adding batteries make sense?","zh":"我们已经有500千瓦光伏。增加电池有意义吗？"},{"who":"Danny","en":"It could, but we'd need to look at how much solar energy is used on-site and how much is exported.","zh":"有可能，但我们要看有多少光伏在现场消纳，多少上网。"},{"who":"Customer","en":"We export some power at noon, and grid prices rise in the evening.","zh":"我们中午有部分电量上网，晚上电网电价更高。"},{"who":"Danny","en":"That sounds promising. Do you have time-of-use electricity tariffs?","zh":"听起来有潜力。你们有分时电价吗？"},{"who":"Customer","en":"Yes, peak pricing is between six and ten in the evening.","zh":"有，晚上六点到十点是高峰电价。"},{"who":"Danny","en":"Could you share the peak and off-peak prices, plus your solar generation data?","zh":"能分享峰谷电价以及光伏发电数据吗？"},{"who":"Customer","en":"We have those numbers in our energy report.","zh":"这些数据在能源报告里。"},{"who":"Danny","en":"Great. We can estimate possible savings once we also review the load profile and local rules.","zh":"很好。结合负荷曲线及当地规则后，我们可以估算潜在节省金额。"},{"who":"Customer","en":"So you can't give me a payback period today?","zh":"所以你今天不能给我投资回收期吗？"},{"who":"Danny","en":"Not reliably yet. I'd rather provide a realistic estimate based on your actual data.","zh":"目前无法可靠计算。我更愿意基于真实数据给您一个合理估算。"}]},{"id":"P07","kind":"电话","title":"移动储能车与CCS2接口咨询","brief":"海外项目询问移动储能车直流充电与交流输出能力。","focus":"确认设备接口和充电场景","challenge":"客户混淆直流充电输入与输出，你要澄清方向。","level":"B1–B2","lines":[{"who":"Customer","en":"We're interested in a mobile battery truck. Can it recharge from a DC fast charger?","zh":"我们对移动储能车感兴趣。它可以从直流快充桩补电吗？"},{"who":"Danny","en":"Our mobile systems can support external DC charging with a compatible interface and communication protocol.","zh":"我们的移动系统可通过匹配的接口及通信协议支持外部直流充电。"},{"who":"Customer","en":"Our existing chargers use CCS2. Would that work?","zh":"现有充电桩使用CCS2，可以吗？"},{"who":"Danny","en":"CCS2 may be an option, but we should confirm the exact vehicle configuration and charger details.","zh":"CCS2可能可行，但需要确认车辆配置和充电桩参数。"},{"who":"Customer","en":"What voltage range do you need?","zh":"需要什么电压范围？"},{"who":"Danny","en":"The relevant mobile configurations can be designed around a DC charging range of 200 to 1,000 volts. The final interface must be confirmed.","zh":"相关移动配置的直流充电范围可按200至1000伏设计，最终接口仍需确认。"},{"who":"Customer","en":"Can we charge and supply AC power at the same time?","zh":"能不能一边充电一边提供交流电？"},{"who":"Danny","en":"That depends on the system configuration and operating limits. I'll ask our engineers to review your use case.","zh":"这取决于系统配置和运行限制。我会请工程师核实您的场景。"},{"who":"Customer","en":"Okay, I'll send the charger datasheet.","zh":"好的，我把充电桩规格书发给你。"},{"who":"Danny","en":"Perfect. Please include the connector type, voltage range, current and communication protocol.","zh":"太好了。请附上接口、电压范围、电流及通信协议。"}]},{"id":"P08","kind":"电话","title":"客户直接要求最低价格","brief":"客户电话询价但没有具体项目参数；你要争取有效的收资。","focus":"处理价格异议、提问、设定下一步","challenge":"客户不愿提供项目地点，怎样礼貌说明报价限制？","level":"B1–B2","lines":[{"who":"Customer","en":"Danny, just give me your lowest price for a 261-kilowatt-hour cabinet.","zh":"Danny，直接给我一台261千瓦时柜子的最低价吧。"},{"who":"Danny","en":"I'd be happy to discuss pricing. May I first confirm the quantity and destination country?","zh":"很乐意讨论价格。我可以先确认数量和目的地国家吗？"},{"who":"Customer","en":"Maybe ten units, but the project isn't final.","zh":"可能十台，但项目还没定。"},{"who":"Danny","en":"Understood. Are you looking for a budgetary indication or a formal quotation?","zh":"明白。您需要预算参考价还是正式报价？"},{"who":"Customer","en":"Just a budgetary price for now.","zh":"目前只是预算参考价。"},{"who":"Danny","en":"That helps. Price depends on the configuration, certifications, delivery terms and quantity.","zh":"好的。价格取决于配置、认证、交货条款和数量。"},{"who":"Customer","en":"A competitor has already quoted something cheaper.","zh":"竞争对手已经报了更低价格。"},{"who":"Danny","en":"I understand. If you share their technical scope, we can compare the solutions fairly, not just the unit prices.","zh":"理解。如果您能提供对方的技术范围，我们可以公平比较方案，而不仅仅比单价。"},{"who":"Customer","en":"I'll send the basic requirements.","zh":"我会发基本需求。"},{"who":"Danny","en":"Great. Then we can prepare an appropriate budgetary offer.","zh":"很好。之后我们就可以准备适当的预算报价。"}]},{"id":"P09","kind":"电话","title":"跨时区预约技术视频会议","brief":"与欧洲客户协调时间，并明确会议议程与参会人员。","focus":"时区、日程、确认会议","challenge":"客户说Wednesday at 3，没有说时区，你如何确认？","level":"B1–B2","lines":[{"who":"Danny","en":"Would it be helpful to arrange a technical video call with our engineers?","zh":"安排一次有我们工程师参加的技术视频会议，会有帮助吗？"},{"who":"Customer","en":"Yes, Wednesday at three works for me.","zh":"可以，周三三点我有空。"},{"who":"Danny","en":"Just to confirm, do you mean three in the afternoon, Warsaw time?","zh":"确认一下，您说的是华沙时间下午三点吗？"},{"who":"Customer","en":"Yes, local time here in Warsaw.","zh":"是的，华沙当地时间。"},{"who":"Danny","en":"Thanks. I'll check our team's availability and confirm the corresponding China time.","zh":"谢谢。我会确认团队是否有空，并核对对应的中国时间。"},{"who":"Customer","en":"Who will attend from your side?","zh":"你们谁会参加？"},{"who":"Danny","en":"I plan to join with a technical engineer. Could your project engineer attend as well?","zh":"我计划带一名技术工程师参加。贵方项目工程师也可以参加吗？"},{"who":"Customer","en":"Yes, I'll invite her.","zh":"可以，我邀请她。"},{"who":"Danny","en":"Great. I'll send an invitation with an agenda covering load data, configuration and next steps.","zh":"很好。我会发送会议邀请和议程，包括负荷数据、配置及下一步。"},{"who":"Customer","en":"Perfect. Please send it by email.","zh":"好，请邮件发送。"}]},{"id":"P10","kind":"电话","title":"保修、循环寿命和SOH追问","brief":"客户把12000次循环和70%/80% EOL混在一起提问；你要澄清口径。","focus":"技术澄清、不确定时不乱承诺","challenge":"一句话解释“循环寿命不是保修承诺”，再约定核实。","level":"B1–B2","lines":[{"who":"Customer","en":"Your brochure mentions long cycle life. Does that mean 12,000 cycles to 80 percent state of health?","zh":"你们宣传册提到了长循环寿命。这是不是指12000次循环后SOH仍有80%？"},{"who":"Danny","en":"Thanks for asking. We need to distinguish laboratory cycle-life data from the contractual warranty.","zh":"谢谢提问。我们需要区分实验室循环寿命数据和合同质保承诺。"},{"who":"Customer","en":"So is the end-of-life threshold 70 or 80 percent?","zh":"那寿命终点是70%还是80%？"},{"who":"Danny","en":"I don't want to give you an unverified number. It depends on the cell and the applicable product specification.","zh":"我不想给出未经核实的数字。这取决于电芯和对应产品规格。"},{"who":"Customer","en":"We need that number for our financial model.","zh":"我们的财务模型需要这个数字。"},{"who":"Danny","en":"Of course. Could you tell me which model and operating conditions you're evaluating?","zh":"当然。请问你们评估的是哪个型号及哪些运行条件？"},{"who":"Customer","en":"The container system, one full cycle per day.","zh":"集装箱系统，每天一整次循环。"},{"who":"Danny","en":"Understood. I'll check the specification and warranty terms with our technical team.","zh":"明白。我会向技术团队核实规格书和质保条款。"},{"who":"Customer","en":"Please send the answer in writing.","zh":"请以书面方式回复。"},{"who":"Danny","en":"Absolutely. I'll make sure the answer clearly separates cycle life, SOH and warranty coverage.","zh":"当然。我会确保答案清楚区分循环寿命、SOH和质保范围。"}]},{"id":"P11","kind":"电话","title":"售后故障和现场工程师协调","brief":"客户储能柜出现报警，要求立刻派人；你需要组织安全和信息收集。","focus":"紧急响应、故障信息、避免危险承诺","challenge":"客户要求你指导他自行拆柜，你该如何安全回应？","level":"B1–B2","lines":[{"who":"Customer","en":"Danny, our battery cabinet is showing a critical alarm. The operator wants someone on-site immediately.","zh":"Danny，我们的电池柜显示严重报警。操作员要求立即有人到现场。"},{"who":"Danny","en":"I'm sorry to hear that. First, please follow the site's safety procedure and keep unqualified personnel away from the equipment.","zh":"很抱歉听到这个情况。请先按照现场安全流程操作，让未经培训的人员远离设备。"},{"who":"Customer","en":"Can you check what happened remotely?","zh":"你们能远程检查发生了什么吗？"},{"who":"Danny","en":"If remote access is available, our technical team can review the EMS alarms and system data.","zh":"如果具备远程连接，我们的技术团队可以检查EMS报警和系统数据。"},{"who":"Customer","en":"What information do you need?","zh":"你们需要什么信息？"},{"who":"Danny","en":"Please share the equipment serial number, alarm code, time of the event and an on-site contact.","zh":"请提供设备序列号、报警代码、发生时间和现场联系人。"},{"who":"Customer","en":"Can you guarantee an engineer will arrive within 24 hours?","zh":"你能保证工程师24小时内到吗？"},{"who":"Danny","en":"I can't confirm that without checking the service arrangements for your site. I'll escalate the issue immediately.","zh":"在核实现场服务安排前我不能保证这一点。我会立即升级处理此问题。"},{"who":"Customer","en":"Please send me an update as soon as possible.","zh":"请尽快更新进度。"},{"who":"Danny","en":"I will. We'll start with safe remote diagnosis and coordinate the next steps with your team.","zh":"会的。我们会先安全地远程诊断，再与贵方协调后续行动。"}]},{"id":"P12","kind":"电话","title":"回访并推进客户下一步","brief":"已发送产品资料，客户一直未回；电话中争取具体行动。","focus":"跟进、尊重节奏、取得下一步承诺","challenge":"客户说“我们再看看”，如何问到明确复盘时间？","level":"B1–B2","lines":[{"who":"Danny","en":"Hi Alex, this is Danny from Wenergy. I'm following up on the product information I sent last week.","zh":"Alex你好，我是Wenergy的Danny。我想跟进上周发送的产品资料。"},{"who":"Customer","en":"Hi Danny. Yes, I saw the email, but we've been busy.","zh":"Danny你好，我看到邮件了，但我们最近很忙。"},{"who":"Danny","en":"No problem at all. I just wanted to check whether the C&I cabinet range is relevant to your upcoming projects.","zh":"完全理解。我想确认我们的工商业柜系列是否符合你们接下来的项目。"},{"who":"Customer","en":"It might be. Our technical manager hasn't reviewed it yet.","zh":"可能符合。我们的技术经理还没看。"},{"who":"Danny","en":"Would a short technical introduction help your team evaluate the options more quickly?","zh":"一次简短技术介绍能否帮助团队更快评估选项？"},{"who":"Customer","en":"Maybe next week. I need to check with him.","zh":"也许下周，我要先跟他确认。"},{"who":"Danny","en":"Of course. Would you prefer that I send two possible meeting times, or follow up after you've spoken with him?","zh":"当然。您希望我发两个候选时间，还是等您和他沟通后再跟进？"},{"who":"Customer","en":"Send two options. That's easier.","zh":"发两个时间吧，更方便。"},{"who":"Danny","en":"Great. I'll email two options and a short agenda. Thank you for your time.","zh":"好的。我会邮件发送两个时间和简短议程。谢谢您的时间。"}]},{"id":"M01","kind":"会议","title":"视频会议开场与议程","brief":"与波兰EPC进行首次三方视频会议；你负责主持会议。","focus":"开场、轮流介绍、设置目标","challenge":"客户中途要求先谈价格，你要礼貌回到议程。","level":"B1–B2","lines":[{"who":"Danny","en":"Good morning, everyone. Can you hear me clearly?","zh":"大家早上好，能清楚听到我吗？"},{"who":"Client PM","en":"Yes, loud and clear. Good to meet you, Danny.","zh":"可以，很清楚。很高兴见到你，Danny。"},{"who":"Danny","en":"Likewise. Thank you for making the time. I'm Danny, an overseas sales manager at Wenergy.","zh":"我也很高兴。感谢大家抽时间。我是Wenergy海外销售经理Danny。"},{"who":"Engineer","en":"Hello, I'm Anna, the project engineer on our side.","zh":"大家好，我是贵方项目工程师Anna。"},{"who":"Danny","en":"Great to meet you, Anna. Shall we begin with a quick overview of your project?","zh":"Anna，很高兴见到你。我们先快速了解一下项目，好吗？"},{"who":"Client PM","en":"Sure. We'd also like to discuss delivery and support.","zh":"可以。我们也想讨论交付和售后。"},{"who":"Danny","en":"Absolutely. I suggest three topics: project requirements, possible technical solutions, and commercial next steps.","zh":"当然。我建议三个议题：项目需求、可能的技术方案以及商务下一步。"},{"who":"Engineer","en":"That works. We have about 40 minutes.","zh":"可以。我们有大约40分钟。"},{"who":"Danny","en":"Perfect. I'll keep us on track, and we'll summarize the action items before we finish.","zh":"很好。我会控制讨论节奏，并在结束前总结行动事项。"},{"who":"Client PM","en":"Sounds good. Let's get started.","zh":"很好。开始吧。"}]},{"id":"M02","kind":"会议","title":"介绍Wenergy及产品线","brief":"向渠道商介绍C&I户外柜、集装箱储能、移动储能三个系列。","focus":"公司简介、产品结构、差异","challenge":"客户要求用一句话概括公司定位。","level":"B1–B2","lines":[{"who":"Danny","en":"Let me give you a short overview of Wenergy and our product range.","zh":"我简要介绍一下Wenergy及产品系列。"},{"who":"Client","en":"Please focus on what you offer for EPC partners.","zh":"请重点介绍能为EPC伙伴提供什么。"},{"who":"Danny","en":"Of course. We provide battery energy storage systems for commercial, industrial and utility-scale applications.","zh":"当然。我们为工商业和大型项目提供电池储能系统。"},{"who":"Danny","en":"For C&I projects, we offer outdoor battery cabinets in several capacities.","zh":"对于工商业项目，我们提供多种容量的户外储能柜。"},{"who":"Client","en":"And for projects above a few megawatt-hours?","zh":"那几兆瓦时以上的项目呢？"},{"who":"Danny","en":"We can discuss containerized solutions, including our 3.85-megawatt-hour product family, depending on the project requirements.","zh":"可以根据项目需求讨论集装箱储能方案，包括3.85兆瓦时产品系列。"},{"who":"Client","en":"Do you also have temporary or mobile applications?","zh":"你们也有临时或移动应用产品吗？"},{"who":"Danny","en":"Yes. We also work on mobile energy storage applications for temporary power and charging scenarios.","zh":"有。我们也提供适用于临时供电和补能的移动储能应用。"},{"who":"Client","en":"What makes you different from a supplier of standard cabinets?","zh":"你们和标准储能柜供应商有什么不同？"},{"who":"Danny","en":"Our goal is to support the complete project, from early technical discussions to delivery and after-sales coordination.","zh":"我们的目标是支持整个项目，从前期技术讨论到交付及售后协调。"}]},{"id":"M03","kind":"会议","title":"24小时食品工厂需求调查","brief":"目标为食品加工厂，已有500kW光伏，想减少高峰电费。","focus":"结构化提问、数据确认","challenge":"客户说每天2500kWh，但没有负荷曲线，你要指出限制。","level":"B1–B2","lines":[{"who":"Client PM","en":"The factory runs around the clock and uses about 2,500 kilowatt-hours per day.","zh":"工厂全天运行，每天用电约2500千瓦时。"},{"who":"Danny","en":"Thanks. Is that a typical working day or an average across the full year?","zh":"谢谢。这是典型工作日还是全年平均？"},{"who":"Factory Engineer","en":"It's an average. Demand is higher during some production shifts.","zh":"是平均值。有些生产班次负荷更高。"},{"who":"Danny","en":"Understood. What's the highest demand in kilowatts?","zh":"明白。最高需求功率是多少千瓦？"},{"who":"Factory Engineer","en":"About 300 kilowatts.","zh":"约300千瓦。"},{"who":"Danny","en":"Does the factory already have solar PV, and do you export excess power?","zh":"工厂已有光伏吗？是否有富余电力上网？"},{"who":"Client PM","en":"Yes, 500 kilowatts on the roof. We export some energy at midday.","zh":"有，屋顶500千瓦。中午有部分电量上网。"},{"who":"Danny","en":"Could you share hourly load data, PV generation and peak/off-peak tariffs?","zh":"能提供小时级负荷、光伏发电及峰谷电价吗？"},{"who":"Factory Engineer","en":"We can provide the last twelve months of data.","zh":"我们可以提供最近12个月的数据。"},{"who":"Danny","en":"Excellent. That will help our team evaluate suitable power and energy capacity rather than guessing a cabinet size.","zh":"太好了。这能帮助团队评估合适的功率和容量，而不是猜一个型号。"}]},{"id":"M04","kind":"会议","title":"解释功率kW与容量kWh","brief":"客户混淆了储能的功率与容量；你要用简单英语解释。","focus":"技术解释、举例、确认理解","challenge":"用不超过三句话解释 250kW/500kWh 的意义。","level":"B1–B2","lines":[{"who":"Client","en":"We're looking for 500 kilowatts of battery storage. Would that be enough for four hours?","zh":"我们要500千瓦的储能，够运行四小时吗？"},{"who":"Danny","en":"We need to separate power from energy capacity. Kilowatts measure power; kilowatt-hours measure stored energy.","zh":"我们要区分功率和容量。千瓦衡量功率，千瓦时衡量储存的能量。"},{"who":"Client","en":"Could you give us a simple example?","zh":"能给个简单例子吗？"},{"who":"Danny","en":"A 250-kilowatt, 500-kilowatt-hour system could theoretically deliver 250 kilowatts for about two hours.","zh":"250千瓦、500千瓦时的系统理论上可提供250千瓦约两小时。"},{"who":"Client","en":"So for four hours at 250 kilowatts, we'd need one megawatt-hour?","zh":"那250千瓦运行四小时，需要1兆瓦时？"},{"who":"Danny","en":"That's the simple energy calculation. In real projects, we also account for usable capacity, efficiency and operating limits.","zh":"这是简单能量计算。实际项目还要考虑可用容量、效率和运行限制。"},{"who":"Client","en":"What if the factory load changes during those hours?","zh":"如果工厂在这些小时里负荷变化呢？"},{"who":"Danny","en":"Then we need the load profile to calculate how much energy the battery must actually deliver.","zh":"那我们需要负荷曲线计算电池实际需要输出多少能量。"},{"who":"Client","en":"I see. We shouldn't choose a size based only on the peak number.","zh":"明白。我们不能只根据峰值数字选型。"},{"who":"Danny","en":"Exactly. Let's size the system around your real operating scenario.","zh":"没错。我们要围绕真实运行场景设计系统。"}]},{"id":"M05","kind":"会议","title":"光储协同和削峰套利方案","brief":"客户希望储能在晚上6点到10点放电，讨论光伏富余和电网补电。","focus":"技术方案、约束、条件式表达","challenge":"客户问“阴天怎么办”，解释两种充电方式。","level":"B1–B2","lines":[{"who":"Client","en":"We want to use batteries to reduce high evening electricity costs.","zh":"我们希望用电池降低晚间高电价成本。"},{"who":"Danny","en":"That may be a good use case. Which hours have the highest tariffs?","zh":"这可能是合适的应用。哪几个小时电价最高？"},{"who":"Client","en":"From six to ten in the evening.","zh":"晚上六点到十点。"},{"who":"Danny","en":"One possible strategy is to charge from excess solar generation during the day and discharge during those peak hours.","zh":"一种可能策略是白天用富余光伏充电，并在高峰时段放电。"},{"who":"Client","en":"What happens on cloudy days when the solar output is low?","zh":"阴天光伏出力低怎么办？"},{"who":"Danny","en":"If the system and local rules allow it, the EMS can also schedule grid charging during lower-price periods.","zh":"如果系统及当地规则允许，EMS也可以安排低价时段电网充电。"},{"who":"Client","en":"Will that guarantee a lower electricity bill?","zh":"这能保证电费降低吗？"},{"who":"Danny","en":"Not without calculation. We need the tariff structure, load profile, PV data and system efficiency.","zh":"没有测算前不能保证。我们需要电价结构、负荷曲线、光伏数据和系统效率。"},{"who":"Client","en":"Can you prepare a savings model?","zh":"你们能准备节省模型吗？"},{"who":"Danny","en":"We can prepare an initial assessment once those inputs are available, then review the assumptions together.","zh":"在有这些输入后我们可以初步评估，并共同核对假设。"}]},{"id":"M06","kind":"会议","title":"EMS功能和第三方系统兼容","brief":"EPC技术经理担心EMS与现场SCADA/PV逆变器的兼容性。","focus":"兼容、接口、范围界定","challenge":"客户问能否兼容某个品牌，不要未经确认就答应。","level":"B1–B2","lines":[{"who":"Client Engineer","en":"Our site already has a SCADA platform and several PV inverters. Can your EMS integrate with them?","zh":"现场已有SCADA平台和多个光伏逆变器。你们EMS可以集成吗？"},{"who":"Danny","en":"Integration may be possible, but we need to review the communication protocols and control requirements.","zh":"可能可以集成，但需要审查通信协议和控制要求。"},{"who":"Client Engineer","en":"We normally use Modbus TCP for monitoring.","zh":"我们通常用Modbus TCP监控。"},{"who":"Danny","en":"Thanks. Could you share the interface list, point map and expected control functions?","zh":"谢谢。能否分享接口清单、点表和期望的控制功能？"},{"who":"Client Engineer","en":"We need active-power control and alarm monitoring.","zh":"我们需要有功功率控制和告警监控。"},{"who":"Danny","en":"Understood. We should also confirm which system will have overall dispatch authority.","zh":"明白。我们还需要确认哪个系统拥有总体调度控制权。"},{"who":"Client PM","en":"Is this included in the standard quotation?","zh":"这包含在标准报价中吗？"},{"who":"Danny","en":"The integration scope needs to be confirmed before we can define the commercial offer.","zh":"集成范围需要先确认，我们才能界定商务报价。"},{"who":"Client Engineer","en":"Let's arrange a technical workshop with both software teams.","zh":"我们安排双方软件团队技术研讨吧。"},{"who":"Danny","en":"Agreed. I'll add protocol review and responsibility boundaries to the agenda.","zh":"同意。我会在议程中加入协议审核和责任边界。"}]},{"id":"M07","kind":"会议","title":"德国100kWh系统与混逆选项","brief":"客户对德国项目的100kWh柜提出有混逆和无混逆两版报价。","focus":"澄清需求、德国并网、方案版本","challenge":"问清客户为什么不要混逆，并解释可能需要独立PCS。","level":"B1–B2","lines":[{"who":"Client","en":"We are considering around fifty 100-kilowatt-hour cabinets for Germany.","zh":"我们考虑在德国采购约50台100千瓦时柜子。"},{"who":"Danny","en":"Thanks. Would you like a hybrid-inverter configuration, a grid-connected PCS configuration, or both for comparison?","zh":"谢谢。您需要混逆配置、并网PCS配置，还是两种都比较？"},{"who":"Client","en":"Please quote both. The version without a hybrid inverter should be cheaper.","zh":"两种都报价。没有混逆的版本应该更便宜。"},{"who":"Danny","en":"We can examine the options. May I ask how the non-hybrid version is expected to charge and discharge?","zh":"可以研究两种方案。我想问无混逆版本计划如何充放电？"},{"who":"Client","en":"The customer mentioned DC charging, but we're still clarifying the application.","zh":"客户提到直流充电，但我们还在澄清场景。"},{"who":"Danny","en":"Understood. Even with DC charging, a grid-connected AC application normally still requires suitable power conversion equipment.","zh":"明白。即使直流充电，并网交流应用通常仍需要合适的电力变换设备。"},{"who":"Client","en":"And can the system connect to the German grid?","zh":"那系统能接入德国电网吗？"},{"who":"Danny","en":"We need to verify the exact PCS model and applicable German grid-code requirements before confirming compliance.","zh":"确认合规前需要核实具体PCS型号及适用的德国并网规范。"},{"who":"Client","en":"Can you provide a comparison table?","zh":"你们能提供对比表吗？"},{"who":"Danny","en":"Yes. I'll request a technical comparison with the configuration, compliance assumptions and cost drivers clearly separated.","zh":"可以。我会申请技术对比，把配置、合规假设和成本因素分开列明。"}]},{"id":"M08","kind":"会议","title":"集装箱大储项目技术评审","brief":"大型项目开发商评估3.85MWh集装箱，讨论并网、责任边界和项目阶段。","focus":"utility-scale、RTB、EPC边界","challenge":"客户问“明天可以签合同吗”，先锁定必要技术信息。","level":"B1–B2","lines":[{"who":"Developer","en":"We're evaluating battery containers for a utility-scale project. The target is around 20 megawatt-hours.","zh":"我们在评估大型储能项目电池集装箱，目标约20兆瓦时。"},{"who":"Danny","en":"Thanks. Is the project still in development, or has it reached ready-to-build status?","zh":"谢谢。项目仍在开发中，还是已经达到可建设状态？"},{"who":"Developer","en":"We expect to reach ready-to-build status in a few months.","zh":"预计几个月后达到可建设状态。"},{"who":"Danny","en":"Understood. What grid connection voltage and point-of-connection requirements are planned?","zh":"明白。计划的并网电压和并网点要求是什么？"},{"who":"EPC Engineer","en":"We're still finalizing the grid studies.","zh":"我们还在完成电网研究。"},{"who":"Danny","en":"That's important for final equipment selection. We can review the battery container scope and clarify the PCS and transformer interfaces.","zh":"这对最终设备选型很重要。我们可以审查电池集装箱范围，并明确PCS和变压器接口。"},{"who":"Developer","en":"Can you already quote your 3.85-megawatt-hour container?","zh":"你们现在能给3.85兆瓦时集装箱报价吗？"},{"who":"Danny","en":"We can discuss an indicative offer, but the final technical and commercial scope should reflect confirmed project requirements.","zh":"我们可以讨论意向报价，但最终技术商务范围应依据确认后的项目需求。"},{"who":"EPC Engineer","en":"We'll share the preliminary single-line diagram.","zh":"我们会分享初步单线图。"},{"who":"Danny","en":"Excellent. Let's review it together and list the open technical questions.","zh":"很好。我们一起审查并列出未决技术问题。"}]},{"id":"M09","kind":"会议","title":"客户要求四小时备电但配置不匹配","brief":"项目说需要4小时备电，但询价设备容量不足，你需要澄清“关键负荷”和“备电时长”。","focus":"发现矛盾、礼貌挑战、提出计算","challenge":"客户坚持先报价，你要解释为什么方案准确性比速度重要。","level":"B1–B2","lines":[{"who":"Client","en":"We need four hours of backup. Can you quote a 200-kilowatt, 400-kilowatt-hour system?","zh":"我们需要四小时备电。你能报200千瓦、400千瓦时系统吗？"},{"who":"Danny","en":"I'd like to clarify one point before we quote. Is the critical load 200 kilowatts for all four hours?","zh":"报价前我想确认一点。关键负荷是四小时都保持200千瓦吗？"},{"who":"Client","en":"Yes, that's the maximum critical load.","zh":"是的，那是最大关键负荷。"},{"who":"Danny","en":"At a constant 200 kilowatts, four hours would require 800 kilowatt-hours of delivered energy before allowing for losses and reserve.","zh":"如果持续200千瓦，四小时需要输出800千瓦时能量，还未考虑损耗和预留。"},{"who":"Client","en":"But our procurement team requested 400 kilowatt-hours.","zh":"但我们的采购团队要求400千瓦时。"},{"who":"Danny","en":"That may cover a lower average load or a shorter duration, but it would not provide 200 kilowatts for four hours.","zh":"它可能满足更低平均负荷或更短时长，但不能支持200千瓦运行四小时。"},{"who":"Client","en":"So what do you recommend?","zh":"那你推荐什么？"},{"who":"Danny","en":"Let's confirm the critical-load curve, minimum backup duration and acceptable operating limits first.","zh":"我们先确认关键负荷曲线、最低备电时长和可接受的运行限制。"},{"who":"Client","en":"Then your engineers can size the system?","zh":"然后你们工程师选型？"},{"who":"Danny","en":"Exactly. That way, the quotation will match the real requirement rather than an incomplete assumption.","zh":"对。这样报价才能匹配真实需求，而不是基于不完整假设。"}]},{"id":"M10","kind":"会议","title":"竞争对手更便宜，讨论长期价值","brief":"客户已有两家低价报价，你要做同口径对比并强调全生命周期服务。","focus":"异议处理、避免贬低竞品、澄清范围","challenge":"客户要求降价10%，你要先核对技术边界和交货条款。","level":"B1–B2","lines":[{"who":"Client","en":"Two other suppliers are at least ten percent cheaper. Why should we choose Wenergy?","zh":"其他两家至少便宜10%，我们为什么选Wenergy？"},{"who":"Danny","en":"That's a fair question. Could we first check whether the quotations cover the same technical scope?","zh":"这是合理问题。我们能否先核对各家报价是否包含同样的技术范围？"},{"who":"Client","en":"They're all around the same capacity.","zh":"容量差不多。"},{"who":"Danny","en":"Capacity is one part. We'd also compare power rating, certifications, warranty terms, delivery scope and service support.","zh":"容量只是一部分，还要比较功率、认证、质保、交付范围和售后支持。"},{"who":"Client","en":"Our finance team mainly cares about the purchase price.","zh":"我们的财务团队主要关注采购价。"},{"who":"Danny","en":"I understand. We should look at upfront cost, but also downtime risk and lifetime operating cost.","zh":"理解。我们既要看初始成本，也要看停机风险和全生命周期运行成本。"},{"who":"Client","en":"Can you improve your offer?","zh":"你们能改进报价吗？"},{"who":"Danny","en":"I'm open to discussing options. If you share the target scope and commercial terms, I can review them internally.","zh":"我们愿意讨论方案。如果您分享目标范围和商务条款，我可以内部评估。"},{"who":"Client","en":"Okay, let's compare the documents first.","zh":"好的，我们先比较文件。"},{"who":"Danny","en":"Great. I'll prepare a side-by-side checklist so we're comparing like with like.","zh":"很好。我会准备逐项对比清单，确保同口径比较。"}]},{"id":"M11","kind":"会议","title":"售后SLA：两小时远程和48小时到场","brief":"波兰EPC要求把响应时间写入合同，你不能未经确认作出保证。","focus":"承诺边界、SLA、服务范围","challenge":"客户问“能否保证48小时”，用三句明确而礼貌的英文回答。","level":"B1–B2","lines":[{"who":"Client PM","en":"For this factory, we want remote support within two hours and an engineer on-site within 48 hours.","zh":"针对工厂，我们希望两小时远程支持，48小时工程师到场。"},{"who":"Danny","en":"I understand why response time matters, especially for a 24-hour production site.","zh":"我理解响应时间的重要性，尤其是24小时运行的生产现场。"},{"who":"Client PM","en":"Can Wenergy guarantee those times in the contract?","zh":"Wenergy能在合同里保证这些时间吗？"},{"who":"Danny","en":"We're open to discussing a service-level agreement, but I need to confirm local service coverage first.","zh":"我们愿意讨论SLA，但我需要先核实当地服务覆盖。"},{"who":"Client Engineer","en":"We already have electricians on-site. Could your team guide them remotely?","zh":"我们现场已有电工。你们能远程指导他们吗？"},{"who":"Danny","en":"For appropriate, authorized tasks, our technical team can coordinate remote troubleshooting with qualified on-site personnel.","zh":"对于适当且获授权的工作，我们的技术团队可以和具备资质的现场人员协同远程排障。"},{"who":"Client PM","en":"What about spare parts?","zh":"备件呢？"},{"who":"Danny","en":"We have spare-parts support in Rotterdam, but we should confirm stock and delivery arrangements for this project.","zh":"我们在鹿特丹有备件支持，但仍需确认该项目库存和交付安排。"},{"who":"Client PM","en":"Please put a proposed service plan in writing.","zh":"请将服务方案书面提出。"},{"who":"Danny","en":"Certainly. I'll review the options with our service team and send a proposal for your review.","zh":"当然。我会和售后团队评估选项，再提供书面建议供您审查。"}]},{"id":"M12","kind":"会议","title":"多人会议中被打断和听不懂","brief":"客户技术经理说话快，又中途打断；你需要控制发言和确认含义。","focus":"礼貌打断、澄清、总结","challenge":"客户一次提出三个问题，你只听清两个，如何接话？","level":"B1–B2","lines":[{"who":"Client PM","en":"Let's move to the interconnection discussion. Anna, could you start?","zh":"我们进入并网讨论。Anna请先说。"},{"who":"Client Engineer","en":"We need remote dispatch, reactive-power control and—sorry, the connection keeps dropping—also the test certificates.","zh":"我们需要远程调度、无功控制，还有——抱歉网络断了——测试证书。"},{"who":"Danny","en":"Sorry, Anna, I caught remote dispatch and reactive-power control, but I missed the last point. Could you repeat it?","zh":"抱歉Anna，我听到了远程调度和无功控制，但最后一点没听清，能重复吗？"},{"who":"Client Engineer","en":"The required test certificates for grid approval.","zh":"用于并网审批的测试证书。"},{"who":"Danny","en":"Thanks for clarifying. I'll note the three requirements separately.","zh":"谢谢澄清。我会把三项要求分别记录。"},{"who":"Client PM","en":"Can you confirm everything today?","zh":"这些今天都能确认吗？"},{"who":"Danny","en":"I can confirm what we've discussed, but I need our compliance engineer to review the certificate list.","zh":"我可以确认讨论内容，但需要合规工程师审查证书清单。"},{"who":"Client Engineer","en":"Sorry to interrupt. The deadline is next Friday.","zh":"打断一下。截止日期是下周五。"},{"who":"Danny","en":"Thanks for highlighting the deadline. May I finish summarizing the requirements, then we can agree on a response date?","zh":"谢谢提醒截止时间。我先总结完需求，然后我们再确认答复日期，好吗？"},{"who":"Client PM","en":"Yes, please go ahead.","zh":"可以，请继续。"}]},{"id":"M13","kind":"会议","title":"会议结束、行动项和下一步","brief":"技术评审会议结束，明确资料、负责人、日期和下一次沟通。","focus":"总结、责任分配、推进","challenge":"用一分钟结束一次真实项目会议，不只是说thank you。","level":"B1–B2","lines":[{"who":"Danny","en":"Before we finish, let me summarize what we've agreed today.","zh":"结束前我总结一下今天达成的共识。"},{"who":"Client PM","en":"Please go ahead.","zh":"请说。"},{"who":"Danny","en":"First, your team will share the load profile, electricity tariffs and PV generation data.","zh":"第一，贵方将提供负荷曲线、电价和光伏发电数据。"},{"who":"Client Engineer","en":"Yes, we'll send those files after our internal review.","zh":"是的，内部审查后发送。"},{"who":"Danny","en":"Second, our engineering team will prepare an initial system concept and a list of technical assumptions.","zh":"第二，我们的工程团队将准备初步系统概念方案和技术假设清单。"},{"who":"Client PM","en":"And what about commercial pricing?","zh":"那商务报价呢？"},{"who":"Danny","en":"We'll prepare an indicative quotation after we confirm the scope and main configuration.","zh":"在确认范围和主要配置后，我们将准备意向报价。"},{"who":"Client Engineer","en":"Shall we schedule the next meeting now?","zh":"我们现在预约下次会议吗？"},{"who":"Danny","en":"Yes, that would be helpful. I'll send two time options with a written summary of today's action items.","zh":"可以。我会发两个时间选项，并书面总结今天的行动项。"},{"who":"Client PM","en":"Perfect. Thanks, everyone. Speak soon.","zh":"很好。谢谢大家，回头联系。"}]}];

let specialSpeechToken=0;
function stopSpecialSpeech(){specialSpeechToken++;try{window.speechSynthesis?.cancel()}catch(e){}}
function speakSpecial(selected,onlyCustomer=false,slow=false){
 if(!('speechSynthesis' in window)){message('当前浏览器不支持文字朗读');return}
 stopSpecialSpeech();let token=specialSpeechToken;
 const lines=selected.lines.filter(l=>!onlyCustomer||l.who!=='Danny');let index=0;
 function next(){
   if(token!==specialSpeechToken||index>=lines.length)return;
   const l=lines[index++];const utter=new SpeechSynthesisUtterance(l.en);
   utter.lang='en-US';utter.rate=slow?.74:.92;utter.pitch=1;
   utter.onend=()=>{if(token===specialSpeechToken)next()};
   utter.onerror=()=>{if(token===specialSpeechToken)next()};
   window.speechSynthesis.speak(utter);
 }
 next();
}
function bindSpecial(){
 document.querySelectorAll('[data-sp-filter]').forEach(b=>b.onclick=()=>{specialState.filter=b.dataset.spFilter;let filtered=SPECIAL.filter(x=>specialState.filter==='全部'||x.kind===specialState.filter);if(!filtered.some(x=>x.id===specialState.id))specialState.id=filtered[0].id;specialState.showEn=false;specialState.showZh=false;render()});
 document.querySelectorAll('[data-sp-pick]').forEach(b=>b.onclick=()=>{specialState.id=b.dataset.spPick;specialState.showEn=false;specialState.showZh=false;stopSpecialSpeech();render()});
 document.querySelectorAll('[data-sp-en]').forEach(b=>b.onclick=()=>{specialState.showEn=!specialState.showEn;render()});
 document.querySelectorAll('[data-sp-zh]').forEach(b=>b.onclick=()=>{specialState.showZh=!specialState.showZh;specialState.showEn=true;render()});
 document.querySelectorAll('[data-sp-audio]').forEach(b=>b.onclick=()=>speakSpecial(getSpecial(),b.dataset.spAudio==='customer',b.dataset.spAudio==='slow'));
 document.querySelectorAll('[data-sp-stop]').forEach(b=>b.onclick=()=>stopSpecialSpeech());
 document.querySelectorAll('[data-sp-line]').forEach(b=>b.onclick=()=>speak(getSpecial().lines[+b.dataset.spLine].en));
 document.querySelectorAll('[data-sp-done]').forEach(b=>b.onclick=()=>{s.specialStudy=s.specialStudy||{};s.specialStudy[specialState.id]=!s.specialStudy[specialState.id];save();render()});
 document.querySelectorAll('[data-sp-next]').forEach(b=>b.onclick=()=>{let list=SPECIAL.filter(x=>specialState.filter==='全部'||x.kind===specialState.filter);let i=list.findIndex(x=>x.id===specialState.id);specialState.id=list[(i+1)%list.length].id;specialState.showEn=false;specialState.showZh=false;stopSpecialSpeech();render()});

function lesson(){return LESSONS[s.currentDay-1]}

function doneDays(){return Object.keys(s.completed).filter(k=>s.completed[k]).length}
function dueCards(){return (s.cards||[]).filter(c=>c.due<=today()).sort((a,b)=>a.due.localeCompare(b.due))}
function totalSeconds(){return Object.values(s.sessions||{}).reduce((a,b)=>a+Number(b||0),0)}
function dSeconds(key){return Number(s.sessions[key]||0)}
function streak(){const records=new Set(Object.keys(s.sessions||{}).filter(k=>s.sessions[k]>=60));Object.keys(s.completed||{}).forEach(d=>{if(typeof s.completed[d]==='string')records.add(s.completed[d])});let k=today();if(!records.has(k))k=addDays(k,-1);let count=0;while(records.has(k)){count++;k=addDays(k,-1)}return count}

function stats(){let last=Array.from({length:7},(_,i)=>addDays(today(),i-6));let best=Math.max(60,...last.map(k=>Math.round(dSeconds(k)/60)));let ratings=Object.values(s.ratings||{}).filter(v=>v>0);let avg=ratings.length?(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1):'—';let reviewed=s.cards.filter(c=>c.reviews>0).length;return `${heading('学习统计','关注真实开口时间、持续性和表达流畅度，而不是虚假的AI打分。')}${statsMini()}<div class="grid two"><section class="card"><div class="sectionhead"><h2>最近7天练习时间</h2><span class="chip">分钟</span></div><div class="bargraph">${last.map(k=>{let v=Math.floor(dSeconds(k)/60);return `<div class="barcol"><span class="val">${v}</span><div class="bar" style="height:${Math.max(4,v/best*125)}px"></div><span class="lab">${k.slice(5).replace('-','/')}</span></div>`}).join('')}</div><p class="tiny">只统计你主动开启并停止的练习计时；未计时的练习不会自动加分钟。</p></section><section class="card"><h2>能力成长快照</h2><div class="phrase"><span>口语自评分均值</span><strong>${avg} ${avg==='—'?'':'/ 5'}</strong></div><div class="phrase"><span>有记录的回答</span><strong>${Object.keys(s.answers).length}</strong></div><div class="phrase"><span>复习过的表达</span><strong>${reviewed}</strong></div><div class="phrase"><span>已完成课程</span><strong>${doneDays()} / 60</strong></div><div class="lined tiny">练习记录保存在本浏览器本地；导出备份后可以在其他设备导入。暂无账号登录与云端自动同步。</div></section></div><section class="card" style="margin-top:18px"><h2>本周复盘问题</h2><p>① 听完客户问题后，能不能先给直接回答？</p><p>② 是否减少了“my suggestion is... my suggestion is...”一类重复？</p><p>③ 遇到技术承诺、认证和质保时，有没有及时说“Let me confirm”而非猜测？</p><p class="tiny">建议每周用同一个30秒话题录音做对比，再根据录音而非转写单独评估发音与流畅度。</p></section>`}
function settings(){return `${heading('设置与备份','先保持简单可靠；后续可以升级到跨设备同步、AI实时评分和PWA自动提醒。')}<div class="grid two"><section class="card"><h2>你的专属课程</h2><div class="phrase"><span>课程长度</span><strong>60天</strong></div><div class="phrase"><span>每日建议</span><strong>90–120分钟</strong></div><div class="phrase"><span>当前进度</span><strong>Day ${s.currentDay}</strong></div><div class="phrase"><span>课程开始</span><strong>${h(s.startDate)}</strong></div><p class="tiny">支持不按日期强制推进：有空练完一天就标记完成，没练时下次继续。</p><div class="actions"><button class="btn outline" data-tab="course">浏览全部课程</button></div></section><section class="card"><h2>你的学习数据</h2><p class="tiny">学习记录、回答和卡片均保存在当前设备的浏览器本地存储，清理网站数据可能造成丢失。</p><div class="actions"><button class="btn primary" data-export="1">↓ 导出JSON备份</button><label class="btn outline" style="cursor:pointer">↑ 导入JSON备份<input type="file" id="import-file" accept="application/json,.json" hidden/></label></div><div class="lined"><h2 style="font-size:15px">安装到手机主屏幕</h2><p class="tiny">把完整项目部署到 HTTPS 网站后，用 Android Chrome 菜单中的「添加到主屏幕」或「安装应用」。语音识别需要浏览器支持和权限；本地HTML文件不保证能访问麦克风。</p><p class="tiny">浏览器TTS可以读出英文，但它不是标准真人录音。当前版本没有自动生成AI语法纠错，使用“复制本课AI陪练指令”转到ChatGPT。</p></div></section></div><div class="notice" style="margin-top:18px">隐私提示：软件不会自行上传练习记录；浏览器自带语音识别功能在某些浏览器中可能将音频发送到语音服务提供商处理。涉及真实客户的信息请先脱敏。</div>`}
function render(){let main=s.tab==='special'?special():s.tab==='practice'?practice():s.tab==='course'?course():s.tab==='review'?review():s.tab==='stats'?stats():s.tab==='settings'?settings():home();document.getElementById('app').innerHTML=`<div class="shell">${side()}<main class="main">${main}</main></div>${mobileNav()}${ui.toast?`<div class="toast">${h(ui.toast)}</div>`:''}`;bind();updateClock();}
function setTab(tab){if(ui.recognizing)stopRecognition();s.tab=tab;save();render();window.scrollTo({top:0,behavior:'instant'})}
function message(msg){ui.toast=msg;render();setTimeout(()=>{if(ui.toast===msg){ui.toast='';let t=document.querySelector('.toast');if(t)t.remove()}},2600)}
function speak(text,slow=false){const synth=window.speechSynthesis;if(!synth){message('此浏览器不支持文字朗读');return}try{synth.cancel();const utter=new SpeechSynthesisUtterance(text);utter.lang='en-US';utter.rate=slow?.77:.92;utter.pitch=1;const voices=synth.getVoices();let voice=voices.find(v=>v.lang.toLowerCase().startsWith('en')&&/google us|samantha|aria|jenny/i.test(v.name))||voices.find(v=>v.lang.toLowerCase().startsWith('en'));if(voice)utter.voice=voice;synth.speak(utter)}catch(e){message('播放失败，请检查系统语音服务')}}
async function copyText(value){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value)}else{const el=document.createElement('textarea');el.value=value;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();if(!document.execCommand('copy'))throw Error('not copied');el.remove()}message('已复制，可粘贴到 ChatGPT')}catch(e){window.prompt('请手动复制下面这段内容',value)}}
function aiPrompt(){let x=lesson();return `你是我的海外储能销售英语口语教练，也是海外EPC客户。今天是Sales English OS Day ${x.day}，主题「${x.title}」，场景「${x.scene}」。练习目标：${x.goal}。你先用英文问我这一个问题："${x.question}"。请遵守：1）严格一次问一个问题，等我回答；2）每轮先简短肯定或指出逻辑问题，然后只纠正最重要的2-3处英语错误；3）给出自然、简短、可复述的英文版本；4）请我重说一次关键句，再继续追问；5）随着我的表现增加场景难度；6）重点训练BESS/ESS海外销售的需求挖掘、技术解释、售后与谈判；7）不编造Wenergy产品参数、认证或公司承诺，未知信息明确需要核实；8）练习结束输出今天的3个错误句及正确句、能力评估与明天复习卡。语音优先，尽量让我用英语开口，不要一次给大量标准答案。`}
function stopRecognition(){let el=document.getElementById('answer');if(el){s.answers[s.currentDay]=el.value.trim();save()}if(ui.rec)try{ui.rec.stop()}catch(e){}ui.rec=null;ui.recognizing=false}
function mic(){if(ui.recognizing){stopRecognition();render();return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){message('当前浏览器没有可用的语音识别，请用Chrome或手动输入');return}try{let rec=new R();ui.rec=rec;rec.lang='en-US';rec.continuous=true;rec.interimResults=true;let initial=document.getElementById('answer').value.trim();let finalText='';rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)finalText+=e.results[i][0].transcript+' ';else interim+=e.results[i][0].transcript}let el=document.getElementById('answer');if(el)el.value=(initial?initial+' ':'')+finalText+interim};rec.onerror=e=>{ui.recognizing=false;ui.rec=null;message('语音识别暂不可用：'+(e.error||'请检查麦克风权限'))};rec.onend=()=>{let el=document.getElementById('answer');if(el){s.answers[s.currentDay]=el.value.trim();save()}ui.recognizing=false;ui.rec=null;render()};rec.start();ui.recognizing=true;render();message('麦克风已启动，请用英语回答')}catch(e){ui.recognizing=false;message('无法启动麦克风：'+e.message)}}
function addCard(en,zh,source,when=today()){if(!en.trim()||!zh.trim())return false;let id=en.trim().toLowerCase();if(s.cards.some(c=>c.id===id))return false;s.cards.push({id,en:en.trim(),zh:zh.trim(),source,stage:0,reviews:0,due:when});save();return true}
function complete(){let x=lesson();s.completed[x.day]=today();(week().phrases||[]).forEach(([en,zh])=>addCard(en,zh,'Week '+x.week,addDays(today(),1)));s.currentDay=Math.min(60,x.day+1);ui.showQuestion=false;ui.showExample=false;save();message(`Day ${x.day} 已完成！${x.day<60?'进入 Day '+s.currentDay:'全部课程已完成'}`)}
function dateSession(seconds,task){if(seconds<=0)return;const k=today();s.sessions[k]=(s.sessions[k]||0)+seconds;const tk=k+':'+task;s.taskSeconds[tk]=(s.taskSeconds[tk]||0)+seconds;save()}
function updateClock(){const c=document.getElementById('clock');if(!c||!ui.timer)return;let secs=Math.floor((Date.now()-ui.timer.start)/1000);c.textContent=pad(Math.floor(secs/60))+':'+pad(secs%60)}
setInterval(updateClock,1000);
function timer(){if(ui.timer){const sec=Math.floor((Date.now()-ui.timer.start)/1000);dateSession(sec,ui.timer.task);ui.timer=null;message(`记录了 ${Math.round(sec/60*10)/10} 分钟练习`)}else{ui.timer={start:Date.now(),task:ui.activeTask};render()}}
function grade(choice){let c=s.cards.find(x=>x.id===ui.reviewId);if(!c)return;c.reviews=(c.reviews||0)+1;if(choice==='again'){c.stage=0;c.due=addDays(today(),1)}else{c.stage=Math.min(5,(c.stage||0)+(choice==='easy'?2:1));let days=[1,2,3,7,14,30][c.stage]||30;c.due=addDays(today(),days)}save();ui.reviewId=null;ui.reviewReveal=false;render()}
function backup(){let b=new Blob([JSON.stringify({format:STORE,exportedAt:new Date().toISOString(),data:s},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sales-english-os-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function bind(){bindSpecial();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let x=s.currentDay,arr=s.checks[x]||Array(5).fill(false);arr[+b.dataset.check]=!arr[+b.dataset.check];s.checks[x]=arr;save();render()});document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak==='example'?lesson().example:lesson().question));document.querySelectorAll('[data-speak-text]').forEach(b=>b.onclick=()=>speak(decodeURIComponent(b.dataset.speakText)));document.querySelectorAll('[data-slow]').forEach(b=>b.onclick=()=>speak(lesson().question,true));document.querySelectorAll('[data-show-question]').forEach(b=>b.onclick=()=>{ui.showQuestion=!ui.showQuestion;render()});document.querySelectorAll('[data-show-example]').forEach(b=>b.onclick=()=>{ui.showExample=!ui.showExample;render()});document.querySelectorAll('[data-pick-day]').forEach(b=>b.onclick=()=>{s.currentDay=+b.dataset.pickDay;ui.showExample=false;ui.showQuestion=false;s.tab='practice';save();render();window.scrollTo({top:0,behavior:'instant'})});document.querySelectorAll('[data-save-answer]').forEach(b=>b.onclick=()=>{s.answers[s.currentDay]=document.getElementById('answer').value.trim();save();message('本次回答已保存')});document.querySelectorAll('[data-save-notes]').forEach(b=>b.onclick=()=>{s.notes[s.currentDay]=document.getElementById('notes').value.trim();save();message('复盘笔记已保存')});document.querySelectorAll('[data-mic]').forEach(b=>b.onclick=mic);document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{let el=document.getElementById('answer');if(el)s.answers[s.currentDay]=el.value.trim();s.ratings[s.currentDay]=+b.dataset.rate;save();render()});document.querySelectorAll('[data-copy-prompt]').forEach(b=>b.onclick=()=>copyText(aiPrompt()));document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=complete);document.querySelectorAll('[data-add-error]').forEach(b=>b.onclick=()=>{let en=document.getElementById('err-en').value,zh=document.getElementById('err-zh').value;if(!en.trim()||!zh.trim()){message('请填写正确英文表达及中文提示');return}if(addCard(en,zh,`Day ${s.currentDay}`)){message('已加入复习，今天就能练')}else message('这条表达已存在于复习卡片中')});document.querySelectorAll('[data-timer]').forEach(b=>b.onclick=timer);let pick=document.getElementById('taskpick');if(pick)pick.onchange=e=>{ui.activeTask=+e.target.value};document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{ui.reviewReveal=true;render()});document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>grade(b.dataset.grade));document.querySelectorAll('[data-export]').forEach(b=>b.onclick=backup);let importEl=document.getElementById('import-file');if(importEl)importEl.onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.format!==STORE||!obj.data||typeof obj.data!=='object')throw Error('文件格式不正确');if(!confirm('导入会覆盖本设备现有学习记录。确定继续吗？'))return;s={...initial(),...obj.data,tab:'home'};save();message('已恢复备份')}catch(err){message('导入失败：'+err.message)}}}
render();
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
